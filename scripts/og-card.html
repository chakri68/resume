<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mako&family=Source+Code+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        background: radial-gradient(
            130% 110% at 82% 8%,
            rgba(122, 162, 255, 0.16) 0%,
            rgba(122, 162, 255, 0) 48%
          ),
          radial-gradient(
            120% 120% at 0% 100%,
            rgba(122, 162, 255, 0.08) 0%,
            rgba(122, 162, 255, 0) 45%
          ),
          #0c0d10;
        color: #e8e8ea;
        font-family: "Mako", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      /* faint dotted grid */
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        );
        background-size: 26px 26px;
        mask-image: linear-gradient(
          120deg,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.15)
        );
        -webkit-mask-image: linear-gradient(
          120deg,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.15)
        );
      }
      .accent-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, #7aa2ff, #395b9c 70%, transparent);
      }
      .inner {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .monogram {
        width: 78px;
        height: 78px;
        border: 1.5px solid rgba(122, 162, 255, 0.45);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(122, 162, 255, 0.06);
        box-shadow: 0 0 40px rgba(122, 162, 255, 0.12);
      }
      .monogram svg {
        width: 40px;
        height: 40px;
      }
      .monogram path {
        fill: #7aa2ff;
      }
      .handle {
        font-family: "Source Code Pro", monospace;
        font-size: 22px;
        color: #8a8f9a;
        letter-spacing: 0.5px;
      }
      .handle b {
        color: #7aa2ff;
        font-weight: 600;
      }
      .mid {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .eyebrow {
        font-family: "Source Code Pro", monospace;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #7aa2ff;
      }
      .name {
        font-size: 76px;
        line-height: 1.02;
        font-weight: 400;
        letter-spacing: 0.5px;
        color: #ffffff;
        max-width: 940px;
      }
      .role {
        font-size: 30px;
        color: #c2c5cc;
        font-weight: 400;
        letter-spacing: 0.3px;
      }
      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 6px;
      }
      .chip {
        font-family: "Source Code Pro", monospace;
        font-size: 19px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(122, 162, 255, 0.28);
        background: rgba(122, 162, 255, 0.07);
        color: #bcc7e6;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-family: "Source Code Pro", monospace;
        font-size: 20px;
        color: #777c87;
      }
      .bottom .stats {
        display: flex;
        gap: 28px;
      }
      .bottom .stats span b {
        color: #d7dae0;
        font-weight: 600;
      }
      .url b {
        color: #7aa2ff;
      }
    </style>
  </head>

    </div>
  </body>
</html>
